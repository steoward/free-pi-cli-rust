name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            binary: free-pi-cli.exe
          - platform: win32-arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: free-pi-cli.exe
          - platform: darwin-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            binary: free-pi-cli
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            binary: free-pi-cli
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: free-pi-cli
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: free-pi-cli

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install extension dependencies
        working-directory: extension
        run: bun install --frozen-lockfile

      - name: Build the bundled extension
        run: bun run build:extension

      - name: Build the native CLI
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Assemble the npm platform package
        run: >-
          node scripts/package-npm.mjs
          --platform ${{ matrix.platform }}
          --binary target/${{ matrix.target }}/release/${{ matrix.binary }}

      - uses: actions/upload-artifact@v4
        with:
          name: free-pi-cli-${{ matrix.platform }}
          path: npm/free-pi-cli-${{ matrix.platform }}
          if-no-files-found: error

  publish:
    name: attach binaries and publish to npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: dist/npm
          pattern: free-pi-cli-*

      - name: Verify release metadata
        run: node scripts/verify-release.mjs --tag "$GITHUB_REF_NAME"

      - name: Check packaged binaries
        run: |
          for dir in dist/npm/*/; do
            test -f "$dir/bin/free-pi-cli" -o -f "$dir/bin/free-pi-cli.exe"
          done

      - name: Attach binaries to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "free-pi-cli $GITHUB_REF_NAME" --generate-notes
          for dir in dist/npm/*/; do
            for file in "$dir"bin/*; do
              gh release upload "$GITHUB_REF_NAME" "$file" --clobber
            done
          done

      # Skipped until an NPM_TOKEN repository secret exists; the GitHub release
      # above still ships every platform binary.
      - name: Publish platform packages
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in dist/npm/*/; do
            (cd "$dir" && npm publish --access public)
          done

      - name: Publish free-pi-cli
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
