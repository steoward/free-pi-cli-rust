[package]
name = "free-pi-cli"
version = "0.7.0"
edition = "2021"
rust-version = "1.80"
description = "Free, ad-supported distribution of the pi coding agent, rewritten as a Rust CLI and launched with bunx."
license = "MIT"
repository = "https://github.com/steoward/free-pi-cli-rust"
homepage = "https://freepi.ai"

[[bin]]
name = "free-pi-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["v7"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
